<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>志恒的家 · 一日居</title>
  <meta name="description" content="陈志恒的个人生活记录：一所下午蓝调里的房子。沿动线走完他的一天，遇见摄影、音乐、算法、技术和旅行。">
  <link rel="stylesheet" href="home.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loader" class="loader">正在推开这扇门</div>
  <div id="fallback" class="fallback">
    这所房子需要 WebGL 才能走进去。<br>
    <a href="list.html">改看卡片目录</a>
  </div>

  <div id="canvas-wrap"></div>
  <div class="vignette"></div>

  <div class="hud">
    <header class="brand">
      <h1>志恒的家</h1>
      <p class="meta">互联网研发 · 把一天安放在这所房子里</p>
      <p class="moment" id="moment">下午 · 蓝调时刻</p>
    </header>

    <p class="hint" id="hint">拖动旋转整座房子 · 点击房间进入 · 或沿一日动线走完他的生活</p>

    <div class="controls">
      <button class="btn is-on" id="btn-god" type="button">上帝视角</button>
      <button class="btn" id="btn-tour" type="button">一日动线</button>
      <a class="btn" href="list.html">卡片目录</a>
    </div>

    <aside class="panel" id="panel" aria-live="polite">
      <p class="panel-kicker" id="panel-kicker"></p>
      <h2 id="panel-title"></h2>
      <p class="story" id="panel-story"></p>
      <div class="links" id="panel-links"></div>
    </aside>

    <nav class="timeline" id="timeline" aria-label="一日动线">
      <div class="timeline-head">
        <span class="now" id="tl-now">17:40 · 蓝调</span>
        <span class="now-desc" id="tl-desc">默认停在下午，房子内外都被最后一层天光看见。</span>
      </div>
      <div class="stops" id="stops"></div>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
