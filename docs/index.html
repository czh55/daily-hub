<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="陈智恒的个人生活空间 — 音乐、摄影、算法、技术学习、播客、视频与旅行记录的 3D 居家分享">
  <title>智恒的家 · 个人生活记录</title>
  <link rel="stylesheet" href="css/home.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading-screen" class="loading-screen">
    <div class="site-title">智恒的家</div>
    <div class="loading-text">正在进入蓝调时刻的居家空间…</div>
    <div class="loading-bar">
      <div id="loading-bar-inner" class="loading-bar-inner"></div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <header class="top-bar">
    <div>
      <div class="site-title">智恒的家</div>
      <div class="site-subtitle">互联网研发 · 个人生活记录分享</div>
    </div>
    <div class="top-actions">
      <button id="btn-god-view" class="btn" title="返回俯瞰视角">俯瞰</button>
      <button id="btn-tour" class="btn btn-primary" title="沿一日动线漫游">一日动线</button>
      <button id="btn-hub" class="btn" title="每日汇总">每日汇总</button>
    </div>
  </header>

  <aside id="room-panel" class="room-panel hidden-init">
    <div id="room-time" class="room-time"></div>
    <h2 id="room-name" class="room-name"></h2>
    <p id="room-mood" class="room-mood"></p>
    <div class="room-divider"></div>
    <ul id="content-list" class="content-list"></ul>
  </aside>

  <nav id="timeline-bar" class="timeline-bar" aria-label="一日动线时间轴"></nav>

  <div id="hint-overlay" class="hint-overlay">
    上帝视角俯瞰整个家 · 点击房间深入探索 · 「一日动线」沿生活轨迹漫游
  </div>

  <script type="module" src="js/home-app.js"></script>
</body>
</html>
